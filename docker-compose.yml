services:
  logs_listener:
    build: .
    ports:
      - "9999:9999/udp" # UDP
    environment:
      - LOG_RETENTION_DAYS=30
      - APM_RETENTION_DAYS=30
      - DB_URL=mongodb://admin:admin@mongo:27017/

  mongo:
    container_name: mongo
    image: mongo:4.4.15
    env_file:
      - .envs/.mongodb
    ports:
      - 27017:27017
    volumes:
      - logs-db-volume:/data/db
    restart: on-failure

  mongo-express:
    container_name: mongo_express
    image: mongo-express:latest
    env_file:
      - .envs/.mongo_express
    depends_on:
        - mongo
    ports:
      - "8888:8081"

volumes:
  logs-db-volume: